# Kernel settings of the lab guest (package B19, Q91, the executor's decision without the lead). lab/install.sh links
# this file into /etc/sysctl.d/, applies it before the lab's units and nginx listen again, and ends the deployment
# unless sysctl shows both values; systemd-sysctl applies it again at every boot. The kernel caps every listen backlog
# at net.core.somaxconn, so it is LISTEN_BACKLOG of lab/services.py, the backlog of lab/nginx.conf; the queue of
# half-open connections follows it.
net.core.somaxconn = 16384
net.ipv4.tcp_max_syn_backlog = 16384
