# PostgreSQL of the lab guest (protocol v5): the defaults except this one setting (proposal chapter 12, the row
# "nastavenia PostgreSQL", rewritten on the lead's answer to Q9, 2026-11-24). lab/install.sh links this file into
# /etc/postgresql/15/main/conf.d/, restarts postgresql@15-main and refuses the deployment unless SHOW
# autovacuum_naptime gives 67s and SHOW autovacuum gives on.
#
# Why: the autovacuum launcher starts one worker per database every autovacuum_naptime. At the default of 60 s and
# three databases that accept connections (hyptcn_lab, postgres, template1) the lab test of 2026-11-23 measured a
# start every 20.006 s (200 spacings, 19.89 to 20.14 s; data/results/skuska_labu_20261123T092454Z_cast1.json),
# exactly four collection intervals of 5 s, its phase moving by 0.22 of an interval an hour. At 67 s the spacing is
# 67/3 = 22.33 s, 2.33 s past a multiple of 5 s, so the phase moves by 0.47 of an interval at every start.
# Autovacuum stays on; only its takt changes, at the source (principle 7, decision D11). The register entry is
# "PostgreSQL autovacuum launcher" in lab/periods.json; a change of the number of databases changes the spacing.
autovacuum_naptime = 67s
