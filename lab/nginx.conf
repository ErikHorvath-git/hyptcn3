server {
    listen 8080;
    server_name _;
    client_max_body_size 8k;
    access_log /var/log/nginx/hyptcn-lab.access.log;
    error_log /var/log/nginx/hyptcn-lab.error.log;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    location = / {
        default_type application/json;
        return 200 '{"lab":"hyptcn3","health":"/healthz","catalog":"/api/catalog","token":"/api/auth/token","orders":"/api/orders"}\n';
    }
    location = /healthz { proxy_pass http://127.0.0.1:8083; }
    location /api/catalog { proxy_pass http://127.0.0.1:8081; }
    location /api/auth/ { proxy_pass http://127.0.0.1:8082; }
    location = /api/orders { proxy_pass http://127.0.0.1:8083; }
    location / { return 404; }
}
