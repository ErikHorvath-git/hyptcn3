# Included in the http context (conf.d). The host generator sends X-Request-ID;
# nginx forwards it (or its own $request_id) to the APIs and logs both.
map $http_x_request_id $hyptcn_rid {
    default $http_x_request_id;
    ""      $request_id;
}

log_format hyptcn_json escape=json
    '{"schema":"hyptcn3/nginx-access/1","ts":"$time_iso8601","msec":$msec,'
    '"rid":"$http_x_request_id","forwarded_rid":"$hyptcn_rid","nginx_rid":"$request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time","upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time","connection":$connection,'
    '"connection_requests":$connection_requests,"remote":"$remote_addr","ua":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;
    client_max_body_size 8k;
    # Outside /var/log/nginx/*.log on purpose: logrotate must not split a
    # measured session; the collection runner closes segments between sessions.
    access_log /var/log/hyptcn-lab/nginx-access.jsonl hyptcn_json buffer=32k flush=2s;
    error_log /var/log/hyptcn-lab/nginx-error.log warn;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $hyptcn_rid;
    location = / {
        default_type application/json;
        return 200 '{"lab":"hyptcn3","health":"/healthz","catalog":"/api/catalog","token":"/api/auth/token","orders":"/api/orders"}\n';
    }
    location = /healthz { proxy_pass http://127.0.0.1:8083; }
    location /api/catalog { proxy_pass http://127.0.0.1:8081; }
    location /api/auth/ { proxy_pass http://127.0.0.1:8082; }
    location = /api/orders { proxy_pass http://127.0.0.1:8083; }
    location / { return 404; }
}
