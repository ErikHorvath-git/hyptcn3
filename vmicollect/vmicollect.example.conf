# =====================================================================
#  vmicollect - vzorova konfiguracia
#
#  Vsetko nizsie ma rozumnu vychodziu hodnotu; zakomentovane riadky su
#  tie vychodzie. Odkomentuj len to, co naozaj menis.
#
#  Zoznam VSETKYCH parametrov:   vmicollect config --keys
#  Co je naozaj nastavene:       vmicollect config -c tento.conf
#  Jednorazova zmena bez editu:  vmicollect run -c tento.conf -o schedule.interval_s=1
# =====================================================================


# ---------------------------------------------------------------------
[vm]
# ---------------------------------------------------------------------
# Koho sledujeme a cez co.

# Ktoru domenu. Beru sa tri tvary:
#   win10      meno z prikazoveho riadku VMM (-name guest=win10) - to iste
#              meno, pod akym ju pozna aj libvirt
#   pid:12345  proces VMM priamo
#   prazdne    ked na stroji bezi jedina KVM domena, najde si ju sama
# Pri backende 'file' sa ignoruje.
domain  = win10

# ebpf - bezica KVM domena cez eBPF. Nepotrebuje patchnute QEMU, libvirt
#        ani KVMi - staci root (CAP_BPF + CAP_PERFMON) a jadro s BTF.
# file - raw obraz na disku; na vyvoj a testy bez VM.
backend = ebpf

# BPF program je vlozeny priamo v binarke. Vlastnu cestu treba iba pri
# jeho ladeni (`make bpf` -> build/vmic_kvm.bpf.o).
#bpf_object = build/vmic_kvm.bpf.o

# Nastavenie backendu 'file'
#image_path = /var/tmp/memory.raw


# ---------------------------------------------------------------------
[schedule]
# ---------------------------------------------------------------------
# Kedy sa zbiera. Terminy sa pocitaju na monotonnych hodinach, takze
# perioda nedriftuje ani ked snimka raz trva dlhsie.

interval_s = 5.0

# Nahodny rozptyl ako podiel periody (0.1 = +-10 %). Bez neho sa moze zber
# "zosynchronizovat" s periodickou aktivitou hosta a systematicky ju bud
# vzdy trafit, alebo vzdy minut.
#jitter = 0.0

# Co ked snimka trva dlhsie ako perioda:
#   skip     - drz povodnu mriezku, zmeskane sloty zahod   (pre casove rady)
#   catch_up - dobehni zmeskane sloty hned za sebou
#   stretch  - dalsi termin = teraz + perioda (bez davok, ale s driftom)
#overrun = skip

# Kolko snimok / ako dlho. 0 = bez limitu (ukoncis Ctrl-C).
#max_cycles = 0
#duration_s = 0

# Zarovnat prvy termin na cely nasobok periody - ked bezi viac zberacov,
# budu vzorkovat v rovnakych okamihoch.
#align = false


# ---------------------------------------------------------------------
[capture]
# ---------------------------------------------------------------------
# Ako sa cita pamat. TOTO JE MIESTO, KDE SA ROZHODUJE O VPLYVE NA VM.

# Pozastavenie vCPU pocas citania. Backend 'ebpf' to NEVIE - eBPF je
# pozorovacie, nie riadiace rozhranie hypervizora - takze snimka je vzdy
# "ziva": kazda stranka je konzistentna sama v sebe, ale dve stranky mozu
# byt z rozneho okamihu. Ked potrebujes naozaj atomicku snimku, zastav VM
# zvonka (virsh suspend DOMENA) a spusti `vmicollect once`.
#pause = false

# Ked pauza presiahne tento cas, zapise sa varovanie do logu aj do metadat.
#pause_max_ms = 500

# Velkost jedneho citania. Backend 'ebpf' ho aj tak rozseka na useky po
# 2 MiB (velkost prenosovej BPF mapy), takze vacsi blok uz nic nezrychli.
#chunk_size = 1MiB

# Prazdne = cela fyzicka pamat.
# Inak zoznam "zaciatok:dlzka" - najrychlejsia cesta ako znizit vplyv na VM,
# ked ta zaujima len cast pamate. Funguje s backendom ebpf aj file.
#regions = 0x0:16MiB, 0x100000000:1GiB

# Fyzicky priestor x86 ma diery (PCI hole, MMIO). true = vyplnit ich
# nulami a pokracovat (odporucane); false = brat to ako chybu.
#skip_read_errors = true
#max_read_errors  = 0


# ---------------------------------------------------------------------
[output]
# ---------------------------------------------------------------------
dir = ./snapshots

# raw   - cely obraz; offset v subore == fyzicka adresa
# delta - iba stranky zmenene od minulej snimky (radovo mensie)
writer = raw

# Dostupne: {domain} {seq} {ts} {backend} {pid}; sirku pises ako {seq:06d}
#name_template = {domain}_{seq:06d}_{ts}

# Nulove bloky vobec nezapisovat (riedky subor). Setri miesto aj cas.
#sparse = true

# none|gzip. Komprimuje sa AZ PO odpauzovani VM, takze to pauzu nepredlzi.
#post_compress = none

# none|sha256. Hash sa tiez pocita az po odpauzovani, nad hotovym suborom.
# Pri velkej RAM to nie je zadarmo (~250 MB/s) - ked ti ide o kazdu
# milisekundu periody, daj 'none'.
#hash = sha256

# .json subor s metadatami vedla kazdej snimky (casy, priepustnost, hash).
# Toto je rozhranie pre vsetko, co pride po zbere - nechaj zapnute.
#sidecar = true

# --- iba pre writer 'delta' ---
# Granularita porovnavania. 4096 zodpoveda strankam x86.
#delta_page_size = 4096
# Kazdych N snimok sa zapise PLNA snimka a zacne novy retazec. Mensie
# cislo = rychlejsia obnova a mensie riziko, vacsie cislo = menej miesta.
#delta_full_every = 20


# ---------------------------------------------------------------------
[retention]
# ---------------------------------------------------------------------
# Automaticke mazanie starych snimok. 0 = vypnute.
# POZOR: pri writeri 'delta' sa maze po CELYCH RETAZCOCH (plna snimka +
# jej delty), lebo bez plnej snimky sa zvysok neda obnovit. Efektivna
# granularita je teda delta_full_every - nastav max_snapshots ako jeho
# nasobok, inak budes prekvapeny, kolko toho naraz zmizne.
# Retencia pracuje nad celym [output].dir a nerozlisuje domeny - kazdej
# domene daj vlastny adresar, inak si dva zberace mazu snimky navzajom.
#max_snapshots = 0
#max_bytes     = 0        # da sa pisat aj "50GiB"
#max_age_s     = 0


# ---------------------------------------------------------------------
[hooks]
# ---------------------------------------------------------------------
# Vlastny kod spustany po kazdej hotovej snimke. Format: cesta.so[:argumenty]
# Riadok sa da opakovat. Vzor: hooks/example_hook.c
#load = ./build/example_hook.so:./snapshots/index.csv

# true  = chyba v pluginu ukonci cely zber
# false = chybny plugin sa iba vypne, zber pokracuje (odporucane)
#strict = false


# ---------------------------------------------------------------------
[log]
# ---------------------------------------------------------------------
#level = INFO          # DEBUG|INFO|WARN|ERROR|NONE
#file  =               # prazdne = stderr
#json  = false         # true = jeden JSON riadok na zaznam
